name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.head.ref == 'release' ||
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' twine
      - id: package
        name: Validate package version and release tag
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path
          from packaging.version import Version

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if project['name'] != 'tribulnation-cli':
              raise SystemExit('Unexpected distribution name')
          version = str(Version(project['version']))
          if version != project['version']:
              raise SystemExit('Use a normalized package version')
          tag = subprocess.run(
              ['git', 'rev-parse', '--verify', f'refs/tags/v{version}'],
              capture_output=True, text=True,
          )
          if tag.returncode == 0:
              raise SystemExit(f'v{version} already exists; bump the version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke-test the wheel in a fresh environment
        run: |
          python -m venv /tmp/tn-release-check
          /tmp/tn-release-check/bin/python -m pip install dist/*.whl
          /tmp/tn-release-check/bin/tn --version
          /tmp/tn-release-check/bin/tn --help
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tribulnation-cli/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          gh release create "v$VERSION" --target "$MERGE_SHA" \
            --title "v$VERSION" --generate-notes \
            --notes "Published as tribulnation-cli==$VERSION on PyPI."
